name: Secure CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache OWASP vulnerability database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Compile and run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Run SpotBugs SAST
        run: ./mvnw --batch-mode --no-transfer-progress spotbugs:check

      - name: Run OWASP Dependency Check SCA
        run: ./mvnw --batch-mode --no-transfer-progress dependency-check:check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            target/spotbugsXml.xml
            target/dependency-check-report.html
            target/dependency-check-report.json
          if-no-files-found: warn
